<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBITKSHI ESPORTS — ROUND BREAK LOOP</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0c;
            --panel: #111215;
            --line: rgba(255, 255, 255, 0.12);
            --white: #f2f3f5;
            --muted: #9aa0a6;
            --red: #ff2438;
            --red-glow: rgba(255, 36, 56, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--white);
            font-family: Inter, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- LOOP ANIMATED BACKGROUND --- */
        .loop-bg {
            position: absolute;
            inset: -100px;
            z-index: 0;
            pointer-events: none;
            background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 40px);
            animation: gridScroll 12s linear infinite;
        }

        @keyframes gridScroll {
            0% { transform: translate(0, 0); }
            100% { transform: translate(56px, 56px); }
        }

        .glow-orb {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--red-glow) 0%, transparent 70%);
            filter: blur(100px);
            z-index: 1;
            pointer-events: none;
            animation: floatGlow 10s ease-in-out infinite alternate;
        }

        .glow-left { top: -200px; left: -150px; }
        .glow-right { bottom: -250px; right: -150px; animation-delay: -5s; }

        @keyframes floatGlow {
            0% { transform: scale(0.9) translate(0, 0); opacity: 0.5; }
            100% { transform: scale(1.2) translate(40px, -30px); opacity: 0.9; }
        }

        .scanline {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
        }

        /* --- OBS DISPLAY CONTAINER --- */
        .obs-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1100px;
            padding: 0 40px;
            text-align: center;
        }

        /* Header / Brand Badge */
        .stream-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(17, 18, 21, 0.85);
            border: 1px solid var(--line);
            border-left: 3px solid var(--red);
            padding: 10px 20px;
            backdrop-filter: blur(8px);
            margin-bottom: 28px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .brand-mark {
            width: 26px; height: 26px;
            background: var(--red);
            color: #000;
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 900;
            font-size: 16px;
            display: grid;
            place-items: center;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
        }

        .brand-text {
            font-family: "Barlow Condensed", sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .dot-amber {
            width: 8px; height: 8px;
            background: #ffb703;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffb703;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Main Titles */
        .main-title {
            font-family: "Barlow Condensed", sans-serif;
            font-size: clamp(54px, 7.5vw, 110px);
            font-weight: 900;
            line-height: 0.88;
            text-transform: uppercase;
            letter-spacing: .01em;
            margin-bottom: 16px;
            text-shadow: 0 0 50px rgba(0,0,0,0.9), 0 0 20px rgba(255,36,56,0.3);
        }

        .main-title span { color: var(--red); }

        .sub-title {
            font-size: 16px;
            color: var(--muted);
            letter-spacing: .1em;
            text-transform: uppercase;
            margin-bottom: 40px;
            font-weight: 600;
        }

        /* --- BREAK TIMER (MINUTES & SECONDS ONLY) --- */
        .timer-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            max-width: 420px;
            margin: 0 auto 40px;
        }

        .timer-box {
            background: rgba(17, 18, 21, 0.9);
            border: 1px solid var(--line);
            padding: 24px 10px;
            position: relative;
            backdrop-filter: blur(12px);
            clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .timer-box::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--red);
            box-shadow: 0 0 12px var(--red);
        }

        .timer-val {
            font-family: "Barlow Condensed", sans-serif;
            font-size: clamp(56px, 7vw, 84px);
            font-weight: 800;
            line-height: 0.9;
            color: var(--white);
        }

        .timer-lbl {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .1em;
            margin-top: 8px;
            font-weight: 600;
        }

        /* Score & Match Status Strip */
        .status-strip {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(17, 18, 21, 0.7);
            border: 1px solid var(--line);
            padding: 14px 36px;
            gap: 30px;
            backdrop-filter: blur(10px);
        }

        .team-block {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .team-name {
            font-family: "Barlow Condensed", sans-serif;
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .team-red { color: var(--red); }

        .score-box {
            font-family: "Barlow Condensed", sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--white);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 16px;
            border: 1px solid var(--line);
            letter-spacing: .1em;
        }

        /* OBS Border Overlay */
        .obs-frame {
            position: absolute;
            inset: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
            z-index: 5;
        }
        .obs-frame::before {
            content: "ROUND BREAK // TECHNICAL PAUSE";
            position: absolute;
            bottom: 10px; right: 15px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 600;
            letter-spacing: .1em;
        }
    </style>
</head>
<body>

    <div class="loop-bg"></div>
    <div class="glow-orb glow-left"></div>
    <div class="glow-orb glow-right"></div>
    <div class="scanline"></div>
    <div class="obs-frame"></div>

    <div class="obs-container">
        
        <!-- Break Status Header -->
        <div class="stream-badge">
            <div class="brand-mark">R</div>
            <div class="brand-text">REBITKSHI ESPORTS</div>
            <div class="dot-amber"></div>
        </div>

        <h1 class="main-title">BE RIGHT <span>BACK</span></h1>
        <p class="sub-title">BREAK BETWEEN ROUNDS // BE RIGHT BACK</p>

        <!-- Countdown Timer (Минуты и Секунды) -->
        <div class="timer-row">
            <div class="timer-box">
                <div class="timer-val" id="minutes">03</div>
                <div class="timer-lbl">Minutes</div>
            </div>
            <div class="timer-box">
                <div class="timer-val" id="seconds">00</div>
                <div class="timer-lbl">Seconds</div>
            </div>
        </div>

        <!-- Current Match Score Bar -->
        <div class="status-strip">
            <div class="team-block">
                <span class="team-name team-red">REBITKSHI</span>
            </div>
            <div class="score-box">0 : 0</div>
            <div class="team-block">
                <span class="team-name">TBD</span>
            </div>
        </div>

    </div>

    <script>
        // Длительность перерыва в минутах
        let breakDurationMinutes = 3; 
        
        let targetTime = new Date().getTime() + (breakDurationMinutes * 60 * 1000);

        function updateBreakTimer() {
            const now = new Date().getTime();
            const distance = targetTime - now;

            if (distance < 0) {
                document.getElementById('minutes').innerText = '00';
                document.getElementById('seconds').innerText = '00';
                return;
            }

            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('minutes').innerText = String(m).padStart(2, '0');
            document.getElementById('seconds').innerText = String(s).padStart(2, '0');
        }

        setInterval(updateBreakTimer, 1000);
        updateBreakTimer();
    </script>
</body>
</html>
